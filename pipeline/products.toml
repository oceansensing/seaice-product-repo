# What this repository publishes: satellite sea ice from the Copernicus Marine Service, each grid
# reaching as far toward its pole as its satellites see — EUMETSAT OSI SAF's daily concentration,
# ice edge and ice type at 0.1 degree and its 48-hour drift at 62.5 km, both poles on one grid; DTU
# Space's Sentinel-1 SAR drift; DMI's 1 km concentrations (the Antarctic's the newest of 7 days, each
# cell's age beside it) and the Arctic's sea and ice surface temperature; AWI's CryoSat-2 and SMOS
# thickness, each pole's; FMI and SMHI's Baltic ice charts. The fetcher is the site's
# `scripts/fetch-seaice.py`, whose docstring carries the measurements.
#
# **To the second host alone** (`r2_only`, the site pipeline's D13, its note of 2026-10-09): every
# root and tile of these products is published to Cloudflare R2 and not to Pages, which carries the
# status alone. The roots stay on the `published` branch, where the next run seeds from them.
#
# **The budgets are each upstream's latency plus a missed day**, measured 2026-10-17 at 13:19 UTC
# from each dataset's newest step: OSI SAF's day D and DMI's surface temperature at D+1 (a root's
# time is its day's start, so 72 hours), DTU's 12-hourly composites within 13 hours (48), DMI's 1 km
# grids at D+2 (96), the Antarctic thickness's 7-day means five days late (168). The Arctic's
# thickness has none: its season is October to April, and the rest of the year its last day stands.
#
# Two rules inherited from the sibling repositories:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs --roots` publishes**, or the
#   orchestrator exits 2 and stops the publish.
# - **A product that leaves takes its files with it**: the seed leaves a top-level file no
#   product's `writes` claims, and the R2 publish removes it.

# **The paths are relative to the site checkout, not to this workspace.**

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

[steps.sic-osisaf]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sic-osisaf"]
lane = "copernicus"

[steps.siedge-osisaf]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=siedge-osisaf"]
lane = "copernicus"

[steps.sitype-osisaf]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sitype-osisaf"]
lane = "copernicus"

[steps.sidrift-osisaf]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sidrift-osisaf"]
lane = "copernicus"

[steps.sidrift-dtu]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sidrift-dtu"]
lane = "copernicus"

[steps.sic-dmi-arctic]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sic-dmi-arctic"]
lane = "copernicus"

[steps.sic-dmi-antarctic]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sic-dmi-antarctic"]
lane = "copernicus"

[steps.sit-cs2smos-arctic]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sit-cs2smos-arctic"]
lane = "copernicus"

[steps.sit-cs2smos-antarctic]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sit-cs2smos-antarctic"]
lane = "copernicus"

[steps.ist-dmi]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=ist-dmi"]
lane = "copernicus"

[steps.sic-fmi]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sic-fmi"]
lane = "copernicus"

[steps.sit-fmi]
cmd = ["python3", "scripts/fetch-seaice.py", "--only=sit-fmi"]
lane = "copernicus"

[products.sic-osisaf]
title = "Sea ice concentration, both poles, daily, AMSR at 10 km (EUMETSAT OSI SAF)"
step = "sic-osisaf"
roots = ["sic-osisaf.json"]
writes = ["sic-osisaf.json"]
namespace = ["python3", "scripts/fetch-seaice.py", "--namespace", "--only=sic-osisaf"]
max_age_hours = 72
r2_only = true

[products.sic-osisaf.tiles]
build = ["python3", "scripts/fetch-seaice.py", "--tiles", "--only=sic-osisaf"]
key = ["python3", "scripts/fetch-seaice.py", "--tile-key", "--only=sic-osisaf"]
cache = "seaice-sic-osisaf-tiles"
match = [
  ["tiles-sic-osisaf", "sic-osisaf.json"],
]

[products.siedge-osisaf]
title = "Sea ice edge, both poles, daily: open water, open ice, closed ice (EUMETSAT OSI SAF)"
step = "siedge-osisaf"
roots = ["siedge-osisaf.json"]
writes = ["siedge-osisaf.json"]
